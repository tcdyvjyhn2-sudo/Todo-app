name: Build and deploy

on:
  push:
    branches:
      - claude/task-list-drag-reorder-hg3n4t

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build site into docs/
        run: npm run build -- --outDir docs

      - name: Commit and push the rebuilt site
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Auto-build: update docs/ from source"
          file_pattern: docs/**
